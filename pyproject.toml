[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matbench-discovery-downstream-analysis"
version = "0.1.0"
description = "Reproducible downstream metric and model analysis for Matbench-Discovery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jinja2>=3.1",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "tabulate>=0.9",
]

[tool.setuptools]
packages = []
